<div class="gallery">
  @for (image of images(); track image; let i = $index) {
    <button type="button" class="gallery__item" (click)="open(image)">
      <img [src]="path(image)" [alt]="alt() + ' ' + (i + 1)" loading="lazy" />
    </button>
  }
</div>

@if (selected(); as current) {
  <div class="lightbox" (click)="close()">
    <button type="button" class="lightbox__close" aria-label="Close" (click)="close()">&times;</button>
    <img [src]="path(current)" [alt]="alt()" (click)="$event.stopPropagation()" />
  </div>
}
